<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>share cards</title>
    <style>
      @font-face {
        font-family: "Outfit Variable";
        src: url("../node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      .card {
        position: relative;
        overflow: hidden;
        color: #f4f4f4;
        font-family: "Outfit Variable", Outfit, ui-sans-serif, system-ui, sans-serif;
      }
      .card img.bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .scrim {
        position: absolute;
        inset: 0;
      }
      .lockup {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .wordmark {
        display: block;
        height: auto;
      }
      .tagline {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0;
        color: #8d8d8d;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .tagline span.rule {
        height: 1px;
        flex: 1;
        background: rgb(244 244 244 / 0.14);
      }
      #og {
        width: 1200px;
        height: 630px;
      }
      #og .scrim {
        background:
          radial-gradient(
            ellipse 70% 70% at 50% 45%,
            rgb(0 0 0 / 0.42),
            rgb(0 0 0 / 0.16) 55%,
            rgb(0 0 0 / 0.52) 100%
          ),
          linear-gradient(to top right, #050505 0%, transparent 28%);
      }
      #og .lockup {
        width: 100%;
        height: 100%;
        padding: 0 120px;
        box-sizing: border-box;
      }
      #og .wordmark {
        width: 640px;
      }
      #og .tagline {
        width: min(720px, 100%);
        margin-top: 28px;
        font-size: 18px;
      }
      #banner {
        width: 1200px;
        height: 264px;
      }
      #banner .scrim {
        background:
          linear-gradient(
            90deg,
            rgb(0 0 0 / 0.78) 0%,
            rgb(0 0 0 / 0.48) 40%,
            rgb(0 0 0 / 0.1) 66%,
            transparent 100%
          ),
          linear-gradient(to top, #050505 0%, transparent 32%);
      }
      #banner .lockup {
        align-items: flex-start;
        justify-content: flex-start;
        width: 50%;
        padding: 42px 0 0 48px;
        box-sizing: border-box;
      }
      #banner .wordmark {
        width: 340px;
      }
      #banner .tagline {
        width: 520px;
        margin-top: 12px;
        font-size: 12px;
        letter-spacing: 0.22em;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div id="og" class="card">
      <img class="bg" alt="" src="og-bg.jpg" />
      <div class="scrim"></div>
      <div class="lockup">
        <img class="wordmark" alt="grokbox" src="../public/wordmark.svg" />
        <p class="tagline">
          <span class="rule"></span>
          <span>Always on. Any hardware. Multi-user.</span>
          <span class="rule"></span>
        </p>
      </div>
    </div>
    <div id="banner" class="card">
      <img class="bg" alt="" src="banner-bg.jpg" />
      <div class="scrim"></div>
      <div class="lockup">
        <img class="wordmark" alt="grokbox" src="../public/wordmark.svg" />
        <p class="tagline">
          <span class="rule"></span>
          <span>Always on. Any hardware. Multi-user.</span>
          <span class="rule"></span>
        </p>
      </div>
    </div>
  </body>
</html>
